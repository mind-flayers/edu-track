name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v1.0.0, v1.1.0, etc.
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build Split APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Include WhatsApp bot submodule
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:

          channel: 'stable'
          cache: true
      
      - name: Install Dependencies
        run: flutter pub get
      
      - name: Decode Firebase Config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
      
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
      
      - name: Create key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
      
      - name: Build Split APKs
        run: flutter build apk --release --split-per-abi
      
      - name: Get Version from Tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Rename APKs
        run: |
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             build/app/outputs/flutter-apk/edutrack-${{ steps.get_version.outputs.VERSION }}-arm64-v8a.apk || true
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             build/app/outputs/flutter-apk/edutrack-${{ steps.get_version.outputs.VERSION }}-armeabi-v7a.apk || true
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
             build/app/outputs/flutter-apk/edutrack-${{ steps.get_version.outputs.VERSION }}-x86_64.apk || true
      
      - name: Get APK Sizes
        id: apk_sizes
        run: |
          ARM64_SIZE=$(ls -lh build/app/outputs/flutter-apk/edutrack-*-arm64-v8a.apk | awk '{print $5}')
          ARMV7_SIZE=$(ls -lh build/app/outputs/flutter-apk/edutrack-*-armeabi-v7a.apk | awk '{print $5}')
          X86_64_SIZE=$(ls -lh build/app/outputs/flutter-apk/edutrack-*-x86_64.apk | awk '{print $5}' 2>/dev/null || echo "-")
          echo "ARM64_SIZE=$ARM64_SIZE" >> $GITHUB_OUTPUT
          echo "ARMV7_SIZE=$ARMV7_SIZE" >> $GITHUB_OUTPUT
          echo "X86_64_SIZE=$X86_64_SIZE" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          repository: mind-flayers/edu-track-releases
          files: |
            build/app/outputs/flutter-apk/edutrack-*-arm64-v8a.apk
            build/app/outputs/flutter-apk/edutrack-*-armeabi-v7a.apk
            build/app/outputs/flutter-apk/edutrack-*-x86_64.apk
          name: EduTrack ${{ steps.get_version.outputs.VERSION }}
          body: |
            # 🎓 EduTrack ${{ steps.get_version.outputs.VERSION }}
            
            ## Release highlights ✅
            - **Build toolchain upgraded**: Android Gradle Plugin **8.9.1**, Gradle **8.12**, Kotlin **2.1.0** (fixes recent AndroidX compatibility failures).
            - **New artifact**: `x86_64` APK is now produced and published (useful for emulators / some Chromebooks).
            - **CI reliability**: release workflow injects required Firebase config at build-time from Actions Secrets (no credentials in repo).
            - **Smaller, focused public releases**: arm64 + armeabi-v7a + optional x86_64 + universal (when produced).
            
            ## 📱 APKs included (pick by device)
            | APK File | Best for | Size |
            |----------|----------|------|
            | **arm64-v8a** | Most modern phones (recommended) | ${{ steps.apk_sizes.outputs.ARM64_SIZE }} |
            | **armeabi-v7a** | Older Android phones | ${{ steps.apk_sizes.outputs.ARMV7_SIZE }} |
            | **x86_64** | Emulators / Chromebook / desktop testing | ${{ steps.apk_sizes.outputs.X86_64_SIZE }} |
            
            ## 🔧 Important upgrade notes (read before installing)
            - This release required an Android toolchain upgrade; if you build locally, run `flutter clean` then `flutter pub get`.
            - CI now decodes `google-services.json` from a repository secret during build — nothing to commit locally.
            - Use **arm64-v8a** for production installs; **x86_64** is primarily for QA/emulator use.
            
            ## ✅ Verification checklist (smoke tests)
            1. Install the **arm64-v8a** APK on a modern device and perform sign-in (Auth).
            2. Open student list → open a student → scan QR to mark attendance (QR flow).
            3. Export a CSV from Students list and verify file opens in Excel/Sheets.
            4. On an emulator/Chromebook, install **x86_64** and run QA flows.
            
            ## ⚠️ Known issues
            - Some older devices may still require the **armeabi-v7a** build.
            - If you hit Firebase-related runtime errors, confirm the app uses the correct Firebase project (check Settings → About in the app).
            
            ## 🔐 SHA256 checksums
            ```
            arm64-v8a: $(sha256sum build/app/outputs/flutter-apk/edutrack-*-arm64-v8a.apk | awk '{print $1}')
            armeabi-v7a: $(sha256sum build/app/outputs/flutter-apk/edutrack-*-armeabi-v7a.apk | awk '{print $1}')
            x86_64: $(sha256sum build/app/outputs/flutter-apk/edutrack-*-x86_64.apk | awk '{print $1}' 2>/dev/null || echo "missing")
            ```
            
            ## 🐛 Report an issue
            Found a problem? Open an issue in the releases repo: https://github.com/mind-flayers/edu-track-releases/issues/new
            
            ---
            
            Made with ❤️ for Educational Institutions
          draft: false
          prerelease: false
          make_latest: true
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      
      - name: Cleanup
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f android/app/google-services.json
